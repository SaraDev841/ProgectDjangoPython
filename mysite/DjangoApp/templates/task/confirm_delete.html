{% extends 'djApp/base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/forms.css' %}">

<div class="form-container danger">
    <h2>Delete Task</h2>

    <p>Are you sure you want to delete <strong>{{ task.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>

    <a href="{% url 'allTask' %} " class="btn-cancel">Cancel</a>
</div>
{% endblock %}
